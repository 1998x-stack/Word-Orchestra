name: Bootstrap dependency lockfile

on:
  push:
    branches:
      - feat/architecture-and-phase0
    paths:
      - package.json
      - .github/workflows/prepare-lockfile.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve exact transitive dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible lockfile to the same branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: lock npm dependency graph"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
